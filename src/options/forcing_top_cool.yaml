# forcing/top-cool options (src/forcing/forcing.hpp); columns: tools/gen_options.py
module: top_cool
struct: TopCoolOptionsImpl
yaml_node: forcing/top-cool
report_title: "-- top cooling options --"
options:
  - {name: flux, key: flux, type: double, default: 0., doc: "Heat flux [W/m^2], <= 0."}
  - {name: depth, key: depth, type: int, default: 1, doc: "Layer depth in cells."}
  - {name: thickness, key: thickness, type: double, default: 0., doc: "The layer in x1 length units; used instead of depth when > 0 (#280)."}
checks:
  - {cond: '!(node["depth"] && node["thickness"])', message: "TopCool: give depth (cells) or thickness (x1 length), not both"}
  - {cond: "op.flux() <= 0.", message: "TopCool flux must be negative"}
  - {cond: "op.depth() > 0.", message: "TopCool depth must be greater than zero"}
  - {cond: '!node["thickness"] || (std::isfinite(op.thickness()) && op.thickness() > 0.)', message: "TopCool thickness must be finite and greater than zero"}
