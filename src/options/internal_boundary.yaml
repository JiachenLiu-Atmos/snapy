# boundary-condition/internal options (src/bc/internal_boundary.hpp): the
# one definition of their members, defaults and deck reader. Columns: see
# tools/gen_options.py.
module: internal_boundary
struct: InternalBoundaryOptionsImpl
yaml_node: boundary-condition/internal
doc: >
  The deck keys of `boundary-condition/internal:`, the solid cells' state
  and the rectifier's iteration limit.
options:
  - {name: max_iter, key: max-iter, type: int, default: 5, doc: "Rectifier iteration limit."}
  - {name: solid_density, key: solid-density, type: double, default: 1.e3, doc: "Density in solid cells."}
  - {name: solid_pressure, key: solid-pressure, type: double, default: 1.e9, doc: "Pressure in solid cells."}
