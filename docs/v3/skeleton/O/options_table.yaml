# V3 lane O skeleton: options table format and sample rows (not wired).
# gen_options.pyi emits from it: C++ struct (ADD_ARG, report, clone),
# from_yaml with check_keys, pybind ADD_OPTION, .pyi stubs, rst docs.
# Columns: name, key (deck key), type, default (the one default), env (legacy
# variable: read once, overrides the deck, warns), python, doc.
module: output
yaml_node: outputs[]
options:
  - {name: dt, key: dt, type: double, default: 0., doc: "interval [s]"}
  - {name: file_type, key: type, type: "enum[netcdf,pnetcdf,restart,budget]", default: null, doc: "required"}
  - {name: x1_slice, key: x1_slice, type: "list[double]", default: [], doc: "x1 cells to keep [m]"}
  - {name: output_sumx1, key: output_sumx1, type: bool, default: false, doc: "sum over x1"}
checks:
  - "!(x1_slice.size() && output_sumx1) : Cannot request both slice and sum along x1"
---
module: hydro
yaml_node: dynamics
options:
  - {name: flux_covariance, key: flux-covariance, type: bool, default: true, doc: "#352"}
  - {name: x1_mass_covariance, key: x1-mass-covariance, type: bool, default: false, doc: "#352"}
  # env overrides the deck (hydro_options.cpp:84-95); FOR CHENG
  - {name: anomaly, key: anomaly, type: bool, default: false, env: SNAP_ANOMALY, doc: "anomaly storage"}
  # exists at the pin (hydro_options.cpp:55,67; hydro.hpp:76, default float64)
  - {name: precision, key: precision, type: "enum[float64,float32]", default: float64, doc: "dynamics precision"}
---
module: integration   # PROVISIONAL names; Cheng's call (V3_ROADMAP.md:300-301)
yaml_node: integration
options:
  - {name: execution, key: execution, type: "enum[eager,graph]", default: eager, doc: "execution selection (G7)"}
  - {name: execution_strict, key: execution-strict, type: bool, default: false, doc: "refuse instead of eager fallback"}
---
module: coord   # lane S parsing accepted (coordinate.cpp:62-114,125-149,213-214)
yaml_node: geometry
options:
  - {name: global_x2min, key: bounds/x2min, alias: {bounds/x2min_pi: "pi"}, type: double, default: 0., doc: "x2 lower bound"}
  - {name: x1rat, key: cells/x1rat, type: double, default: null, doc: "x1 stretch ratio"}
  - {name: x1_centroid_exact, key: x1-centroid-exact, type: bool, default: false, env: SNAP_X1_CENTROID_EXACT, doc: "proposed; owner decides"}
checks:
  - "!(x1rat && x1f) : geometry: give cells/x1rat or x1f, not both (#280)"
---
module: layout  # layout.cpp:249-272; also bc/internal_boundary.cpp:14-36
yaml_node: distribute
options:
  - {name: pz, key: nb1, type: int, default: 1, doc: "blocks along x1"}
  - {name: backend, key: null, type: string, default: gloo, env: BACKEND, doc: "process-group backend"}
