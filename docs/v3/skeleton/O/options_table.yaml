# V3 lane O skeleton: options table format and sample rows (not wired).
# gen_options.pyi emits from it: C++ struct (ADD_ARG, report, clone),
# from_yaml with check_keys, pybind ADD_OPTION, .pyi stubs, rst docs.
# Columns: name, key (deck key; null = not in the deck), type, default (the
# one default), env (legacy variable: read once, overrides the deck, warns),
# python (bind, default true), doc.
module: output
yaml_node: outputs[]
options:
  - {name: dt, key: dt, type: double, default: 0., doc: "interval [s]"}
  - {name: file_type, key: type, type: "enum[netcdf,pnetcdf,restart,budget]", default: null, doc: "required"}
  - {name: variables, key: variables, type: "list[string]", default: [], doc: "field registry keys"}
  - {name: x1_slice, key: x1_slice, type: "list[double]", default: [], doc: "x1 cells to keep [m]"}
  - {name: output_sumx1, key: output_sumx1, type: bool, default: false, doc: "sum over x1"}
  - {name: double_precision, key: double_precision, type: bool, default: false, doc: "NC_DOUBLE"}
  - {name: combine, key: combine, type: bool, default: true, doc: "join parts on root"}
checks:
  - "!(x1_slice.size() && output_sumx1) : Cannot request both slice and sum along x1"
---
module: hydro
yaml_node: dynamics
options:
  - {name: flux_covariance, key: flux-covariance, type: bool, default: true, doc: "#352"}
  - {name: x1_mass_covariance, key: x1-mass-covariance, type: bool, default: false, doc: "#352"}
  # env overrides the deck (hydro_options.cpp:84-95); FOR CHENG
  - {name: anomaly, key: anomaly, type: bool, default: false, env: SNAP_ANOMALY, doc: "anomaly storage"}
  # Step-0 FP32 storage emulation; today env only, read once per process
  # (fp32_storage.cpp:88-97, getenv at :25); FOR CHENG: keep or drop
  - {name: fp32_storage, key: fp32-storage, type: "enum[off,step,stage]", default: "off", env: SNAP_FP32_STORAGE, doc: "round stored state through float32 (fp32_storage.cpp:92)"}
  - {name: fp32_storage_rows, key: fp32-storage-rows, type: "list[string]", default: [], env: SNAP_FP32_STORAGE_ROWS, doc: "rows to round, empty = all (fp32_storage.cpp:93)"}
