reference-state:
  Tref: 0.0
  Pref: 1.e5
species:
- name: dry
  composition:
    H: 1.5
    He: 0.15
  cv_R: 2.5
- name: H2O
  composition:
    H: 2
    O: 1
  cv_R: 2.5
  u0_R: 0.0
- name: NH3
  composition:
    N: 1
    H: 3
  cv_R: 2.5
  u0_R: 0.0
- name: H2S
  composition:
    H: 2
    S: 1
  cv_R: 2.5
  u0_R: 0.0
- name: H2O(l)
  composition:
    H: 2
    O: 1
  cv_R: 9.0
  u0_R: -3430.0
- name: H2O(l,p)
  composition:
    H: 2
    O: 1
  cv_R: 9.0
  u0_R: -3430.0
- name: NH3(s)
  composition:
    N: 1
    H: 3
  cv_R: 9.0
  u0_R: -5520.0
- name: NH3(s,p)
  composition:
    N: 1
    H: 3
  cv_R: 9.0
  u0_R: -5520.0
- name: NH4SH(s)
  composition:
    N: 1
    H: 5
    S: 1
  cv_R: 9.0
  u0_R: -1.2e4
- name: NH4SH(s,p)
  composition:
    N: 1
    H: 5
    S: 1
  cv_R: 9.0
  u0_R: -1.2e4
geometry:
  type: cartesian
  bounds:
    x1min: 0.0
    x1max: 300.e3
    x2min: 0.0
    x2max: 1.0
    x3min: 0.0
    x3max: 1
  cells:
    nx1: 128
    nx2: 1
    nx3: 1
    nghost: 3
distribute:
  layout: slab
  nb2: 1
  nb3: 1
  blocks_per_process: 1
  verbose: false
dynamics:
  equation-of-state:
    type: ideal-moist
    density-floor: 1.0e-16
    pressure-floor: 1.0e-16
    limiter: true
    max-iter: 20
    ftol: 1.0e-06
  reconstruct:
    vertical:
      type: weno5
      scale: true
      shock: true
    horizontal:
      type: weno5
      scale: true
      shock: true
  riemann-solver:
    type: hllc
boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting
integration:
  type: rk3
  cfl: 100.0
  implicit-scheme: 1
  nlim: 3
  tlim: 2.e5
  ncycle_out: 200
outputs:
- type: netcdf
  variables:
  - prim
  - uov
  - thermo
  - path
  dt: 1.e3
- type: restart
  dt: 1.0e-09
forcing:
  const-gravity:
    grav1: -22.0
sedimentation:
  radius:
    H2O(l,p): 1.0e-10
    NH3(s,p): 1.0e-10
    NH4SH(s,p): 1.0e-10
  density:
    H2O(l,p): 1000.0
    NH3(s,p): 800.0
    NH4SH(s,p): 1500.0
  const-vsed:
    H2O(l,p): -1.0
    NH3(s,p): -1.0
    NH4SH(s,p): -1.0
reactions:
- equation: H2O => H2O(l)
  type: nucleation
  rate-constant:
    formula: h2o_ideal
- equation: H2O(l) => H2O(l,p)
  type: coagulation
  rate-constant:
    A: 1.0e-05
    b: 0
    Ea_R: 0.0
- equation: H2O(l,p) => H2O
  type: evaporation
  rate-constant:
    formula: h2o_ideal
    diff_c: 2.0e-05
    diff_T: 1.75
    diff_P: -1.0
    vm: 1.8e-05
    diameter: 0.0001
- equation: NH3 => NH3(s)
  type: nucleation
  rate-constant:
    formula: nh3_ideal
- equation: NH3(s) => NH3(s,p)
  type: coagulation
  rate-constant:
    A: 1.0e-05
    b: 0
    Ea_R: 0.0
- equation: NH3(s,p) => NH3
  type: evaporation
  rate-constant:
    formula: nh3_ideal
    diff_c: 2.0e-05
    diff_T: 1.75
    diff_P: -1.0
    vm: 2.5e-05
    diameter: 0.0001
- equation: NH3 + H2S <=> NH4SH(s)
  type: nucleation
  rate-constant:
    formula: nh3_h2s_lewis
- equation: NH4SH(s) => NH4SH(s,p)
  type: coagulation
  rate-constant:
    A: 1.0e-05
    b: 0
    Ea_R: 0.0
- equation: NH4SH(s,p) => NH3 + H2S
  type: evaporation
  rate-constant:
    formula: nh3_h2s_lewis
    diff_c: 2.0e-05
    diff_T: 1.75
    diff_P: -1.0
    vm: 4.3e-05
    diameter: 0.0001
problem:
  Ps: 100.e5
  Ts: 600.0
  Tmin: 110.0
  xH2O: 0.003
  xNH3: 0.00032
  xH2S: 1.0e-05
  pocket-center: 280.e3
  pocket-width: 10.0e3
  qH2Olp: 0.01
  qNH3sp: 0.01
  qNH4SHsp: 0.01
